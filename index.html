<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음절 — 마음이 무거울 때, 잠시 여기 머무세요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1612;
    --ink-soft: #3d3530;
    --ink-muted: #7a6e67;
    --ink-faint: #b8afa8;
    --paper: #faf7f2;
    --paper-warm: #f4ede3;
    --paper-deep: #ede4d8;
    --gold: #c8a96e;
    --gold-soft: #e8d5b0;
    --ember: #8b4513;
    --moss: #4a6741;
    --lotus: #c97b84;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 텍스처 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(ellipse at 20% 20%, rgba(200, 169, 110, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(139, 69, 19, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* 헤더 */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(250, 247, 242, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200, 169, 110, 0.2);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
  }

  .logo-symbol {
    font-size: 20px;
    line-height: 1;
  }

  .logo-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  nav {
    display: flex;
    gap: 0;
  }

  nav button {
    background: none;
    border: none;
    padding: 8px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-muted);
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  nav button:hover,
  nav button.active {
    color: var(--ink);
    background: var(--paper-warm);
  }

  nav button.active {
    color: var(--ember);
  }

  /* 메인 컨테이너 */
  main {
    position: relative;
    z-index: 1;
    padding-top: 72px;
  }

  /* 섹션 공통 */
  .section {
    display: none;
    min-height: calc(100vh - 72px);
    animation: fadeIn 0.4s ease;
  }

  .section.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 홈 섹션 ===== */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 72px);
    text-align: center;
    padding: 3rem 2rem;
  }

  #home.active { display: flex; }

  .home-symbol {
    font-size: 48px;
    margin-bottom: 1.5rem;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .home-title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 1rem;
    color: var(--ink);
  }

  .home-subtitle {
    font-size: 15px;
    color: var(--ink-muted);
    line-height: 1.8;
    max-width: 420px;
    margin: 0 auto 2.5rem;
  }

  .daily-card {
    background: var(--paper-warm);
    border: 1px solid rgba(200, 169, 110, 0.3);
    border-radius: 16px;
    padding: 1.5rem 2rem;
    max-width: 480px;
    width: 100%;
    margin: 0 auto 2.5rem;
  }

  .daily-card-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .daily-card-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    line-height: 1.9;
    color: var(--ink-soft);
    font-weight: 300;
  }

  .cta-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 14px 28px;
    border-radius: 40px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .btn-primary:hover {
    background: var(--ink-soft);
    transform: translateY(-2px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid rgba(26, 22, 18, 0.2);
    padding: 14px 28px;
    border-radius: 40px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 300;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .btn-secondary:hover {
    background: var(--paper-warm);
    transform: translateY(-2px);
  }

  /* ===== 고민 상담 섹션 ===== */
  #consult {
    padding: 2rem;
    max-width: 680px;
    margin: 0 auto;
  }

  .section-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .section-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .section-desc {
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.7;
  }

  .scripture-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  .pill {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(200, 169, 110, 0.3);
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    font-weight: 300;
  }

  .pill:hover { background: var(--paper-warm); color: var(--ink); }

  .pill.active {
    background: var(--paper-deep);
    border-color: var(--gold);
    color: var(--ember);
  }

  .input-box {
    background: white;
    border: 1px solid rgba(200, 169, 110, 0.25);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: border-color 0.2s;
  }

  .input-box:focus-within {
    border-color: rgba(200, 169, 110, 0.6);
  }

  .input-label {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 10px;
    display: block;
    letter-spacing: 0.03em;
  }

  textarea {
    width: 100%;
    border: none;
    outline: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--ink);
    background: transparent;
    resize: none;
    min-height: 120px;
    line-height: 1.8;
  }

  textarea::placeholder { color: var(--ink-faint); }

  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1rem;
  }

  .example-chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid var(--paper-deep);
    background: var(--paper-warm);
    color: var(--ink-soft);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    font-weight: 300;
  }

  .example-chip:hover {
    background: var(--paper-deep);
    color: var(--ink);
  }

  .ask-btn {
    width: 100%;
    padding: 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .ask-btn:hover { background: var(--ink-soft); }
  .ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 응답 카드 */
  .response-card {
    display: none;
    margin-top: 1.5rem;
    background: var(--paper-warm);
    border: 1px solid rgba(200, 169, 110, 0.3);
    border-radius: 16px;
    padding: 1.5rem;
    animation: fadeIn 0.5s ease;
  }

  .response-card.visible { display: block; }

  .response-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .response-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    line-height: 2;
    color: var(--ink-soft);
    font-weight: 300;
    white-space: pre-wrap;
    margin-bottom: 16px;
  }

  .scripture-quote {
    border-left: 2px solid var(--gold-soft);
    padding: 10px 16px;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.5);
    border-radius: 0 8px 8px 0;
  }

  .scripture-source {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.08em;
    margin-bottom: 5px;
  }

  .scripture-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.8;
    font-weight: 300;
  }

  .share-btn {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid rgba(200, 169, 110, 0.4);
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .share-btn:hover {
    background: var(--paper-deep);
    color: var(--ink);
    border-color: var(--gold);
  }

  /* 로딩 */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 1rem 0;
  }

  .loading span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: breathe 1.4s ease-in-out infinite;
  }

  .loading span:nth-child(2) { animation-delay: 0.2s; }
  .loading span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes breathe {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }

  /* ===== 마음 올리기 섹션 ===== */
  #maeum {
    padding: 2rem;
    max-width: 680px;
    margin: 0 auto;
  }

  .maeum-feed {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 1.5rem;
  }

  .maeum-card {
    background: white;
    border: 1px solid rgba(200, 169, 110, 0.2);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    transition: all 0.2s;
  }

  .maeum-card:hover {
    border-color: rgba(200, 169, 110, 0.4);
    transform: translateY(-2px);
  }

  .maeum-worry {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    margin-bottom: 10px;
    font-weight: 300;
  }

  .maeum-answer {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.8;
    font-weight: 300;
    border-top: 1px solid var(--paper-deep);
    padding-top: 10px;
    margin-bottom: 12px;
  }

  .maeum-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .maeum-time {
    font-size: 11px;
    color: var(--ink-faint);
  }

  .light-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--paper-deep);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 300;
  }

  .light-btn:hover,
  .light-btn.lit {
    background: rgba(200, 169, 110, 0.1);
    border-color: var(--gold);
    color: var(--ember);
  }

  .light-btn.lit .flame { animation: flicker 1s ease-in-out infinite; }

  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(-3deg); }
    50% { transform: scale(1.2) rotate(3deg); }
  }

  .light-count {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 300;
  }

  /* ===== 사찰 찾기 섹션 ===== */
  #temple {
    padding: 2rem;
    max-width: 680px;
    margin: 0 auto;
  }

  .location-btn {
    width: 100%;
    padding: 14px;
    background: var(--paper-warm);
    border: 1px solid rgba(200, 169, 110, 0.3);
    border-radius: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 1.5rem;
  }

  .location-btn:hover {
    background: var(--paper-deep);
    border-color: var(--gold);
  }

  .temple-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .temple-card {
    background: white;
    border: 1px solid rgba(200, 169, 110, 0.2);
    border-radius: 14px;
    padding: 1.25rem;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s;
  }

  .temple-card:hover {
    border-color: rgba(200, 169, 110, 0.4);
    transform: translateY(-2px);
  }

  .temple-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--paper-warm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .temple-info { flex: 1; }

  .temple-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 3px;
  }

  .temple-address {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
    font-weight: 300;
  }

  .temple-dist {
    font-size: 12px;
    color: var(--gold);
    font-weight: 400;
    margin-top: 4px;
  }

  /* 법문 섹션 */
  #dharma {
    padding: 2rem;
    max-width: 680px;
    margin: 0 auto;
  }

  .dharma-today {
    background: var(--paper-warm);
    border: 1px solid rgba(200, 169, 110, 0.3);
    border-radius: 20px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 2rem;
  }

  .dharma-date {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .dharma-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    line-height: 2;
    color: var(--ink-soft);
    font-weight: 300;
    margin-bottom: 16px;
  }

  .dharma-source {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .dharma-history {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dharma-item {
    background: white;
    border: 1px solid rgba(200, 169, 110, 0.15);
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
  }

  .dharma-item-date {
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }

  .dharma-item-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    font-weight: 300;
  }

  /* 반응형 */
  @media (max-width: 600px) {
    header { padding: 1rem; }
    nav button { padding: 6px 10px; font-size: 12px; }
    .logo-text { font-size: 16px; }
    #consult, #maeum, #temple, #dharma { padding: 1rem; }
  }

  /* 알림 토스트 */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 300;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <a class="logo" href="#" onclick="showSection('home')">
    <span class="logo-symbol">☸</span>
    <span class="logo-text">마음절</span>
  </a>
  <nav>
    <button onclick="showSection('consult')" id="nav-consult">고민 상담</button>
    <button onclick="showSection('maeum')" id="nav-maeum">마음 올리기</button>
    <button onclick="showSection('dharma')" id="nav-dharma">오늘의 법문</button>
    <button onclick="showSection('temple')" id="nav-temple">사찰 찾기</button>
  </nav>
</header>

<main>

  <!-- 홈 -->
  <section id="home" class="section active">
    <div class="home-symbol">☸️</div>
    <h1 class="home-title">마음이 무거울 때<br>잠시 여기 머무세요</h1>
    <p class="home-subtitle">판단하지 않습니다. 팔만대장경과 주요 경전을 기반으로 AI 스님이 함께 바라봐 드립니다.</p>
    <div class="daily-card">
      <p class="daily-card-label">✦ 오늘의 법문</p>
      <p class="daily-card-text" id="home-daily">불러오는 중...</p>
    </div>
    <div class="cta-group">
      <button class="btn-primary" onclick="showSection('consult')">고민 상담하기</button>
      <button class="btn-secondary" onclick="showSection('maeum')">마음 나누기</button>
    </div>
  </section>

  <!-- 고민 상담 -->
  <section id="consult" class="section">
    <div class="section-header">
      <h2 class="section-title">AI 스님께 여쭙기</h2>
      <p class="section-desc">팔만대장경과 주요 경전을 기반으로 말씀드립니다</p>
    </div>

    <div class="scripture-pills">
      <button class="pill active" onclick="selectScripture(this,'전체')">전체</button>
      <button class="pill" onclick="selectScripture(this,'금강경')">금강경</button>
      <button class="pill" onclick="selectScripture(this,'법구경')">법구경</button>
      <button class="pill" onclick="selectScripture(this,'반야심경')">반야심경</button>
      <button class="pill" onclick="selectScripture(this,'화엄경')">화엄경</button>
      <button class="pill" onclick="selectScripture(this,'숫타니파타')">숫타니파타</button>
    </div>

    <div class="example-chips">
      <span class="example-chip" onclick="setExample('이직을 해야 할지 모르겠어요')">이직 고민</span>
      <span class="example-chip" onclick="setExample('소중한 사람과 헤어졌어요')">이별의 아픔</span>
      <span class="example-chip" onclick="setExample('미래가 불안하고 두려워요')">미래의 불안</span>
      <span class="example-chip" onclick="setExample('나는 왜 이렇게 부족한 걸까요')">자책</span>
      <span class="example-chip" onclick="setExample('돈이 없어서 너무 힘들어요')">경제적 어려움</span>
      <span class="example-chip" onclick="setExample('사람들이 나를 이해하지 못해요')">외로움</span>
    </div>

    <div class="input-box">
      <label class="input-label">지금 마음에 걸리는 것이 있으신가요?</label>
      <textarea id="worry-input" placeholder="판단하지 않습니다. 편하게 털어놓으세요." rows="5"></textarea>
    </div>

    <button class="ask-btn" id="ask-btn" onclick="askMonk()">☸ 말씀 여쭙기</button>

    <div class="response-card" id="response-card">
      <p class="response-label">✦ 스님의 말씀</p>
      <p class="response-text" id="response-text"></p>
      <div class="scripture-quote" id="scripture-quote" style="display:none">
        <p class="scripture-source" id="scripture-source"></p>
        <p class="scripture-text" id="scripture-text"></p>
      </div>
      <button class="share-btn" onclick="shareToMaeum()">🕯 이 마음을 마음절에 올리기</button>
    </div>
  </section>

  <!-- 마음 올리기 -->
  <section id="maeum" class="section">
    <div class="section-header">
      <h2 class="section-title">마음 올리기</h2>
      <p class="section-desc">익명으로 올려진 고민과 말씀입니다. 공감되신다면 등불을 놓아주세요.</p>
    </div>
    <div class="maeum-feed" id="maeum-feed"></div>
  </section>

  <!-- 오늘의 법문 -->
  <section id="dharma" class="section">
    <div class="dharma-today">
      <p class="dharma-date" id="dharma-date">오늘의 법문</p>
      <p class="dharma-text" id="dharma-text">불러오는 중...</p>
      <p class="dharma-source" id="dharma-source"></p>
    </div>
    <div class="dharma-history" id="dharma-history"></div>
  </section>

  <!-- 사찰 찾기 -->
  <section id="temple" class="section">
    <div class="section-header">
      <h2 class="section-title">가까운 사찰 찾기</h2>
      <p class="section-desc">마음이 정리되셨다면, 직접 찾아가보는 것도 좋습니다</p>
    </div>
    <button class="location-btn" onclick="findTemples()">📍 내 위치에서 가까운 사찰 찾기</button>
    <div class="temple-list" id="temple-list"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
// ===== 상태 =====
let selectedScripture = '전체';
let currentResponse = null;
let maeumData = [];

// ===== 경전 데이터 =====
const SCRIPTURES = {
  금강경: `【금강경】응무소주 이생기심(應無所住 而生其心) — 머무는 바 없이 그 마음을 내라. 범소유상 개시허망(凡所有相 皆是虛妄) — 형상이 있는 것은 모두 허망하다. 일체유위법 여몽환포영(一切有爲法 如夢幻泡影) — 모든 조건 지어진 것은 꿈, 환상, 물거품, 그림자 같다. 과거심 불가득 현재심 불가득 미래심 불가득 — 과거도 현재도 미래 마음도 얻을 수 없다.`,
  법구경: `【법구경】마음은 모든 것에 앞선다. 마음이 주인이고 마음이 만든다. 원한은 원한으로 결코 풀리지 않는다. 원한은 오직 사랑으로 풀린다. 자신을 이기는 것이 다른 사람을 이기는 것보다 위대하다. 건강은 최고의 이익이요, 만족은 최고의 재산이다. 집착에서 슬픔이 생기고, 집착에서 두려움이 생긴다.`,
  반야심경: `【반야심경】색즉시공 공즉시색(色卽是空 空卽是色) — 형상이 곧 공이요, 공이 곧 형상이다. 심무가애 무가애고 무유공포(心無罣礙 無罣礙故 無有恐怖) — 마음에 걸림이 없으므로 두려움이 없다. 조견오온개공 도일체고액 — 오온이 모두 공함을 비추어 보고 모든 괴로움을 건넜다.`,
  화엄경: `【화엄경】일즉일체 일체즉일(一卽一切 一切卽一) — 하나가 곧 전체요, 전체가 곧 하나다. 심여공화사(心如工畵師) — 마음은 훌륭한 화가와 같아서 온갖 세상을 그려낸다. 초발심시변정각(初發心時便正覺) — 처음 마음을 낼 때 그것이 곧 깨달음이다.`,
  숫타니파타: `【숫타니파타】모든 살아있는 존재가 행복하기를, 안전하기를, 마음이 평화롭기를. 집착에서 슬픔이 생기고 집착에서 두려움이 생긴다. 집착에서 자유로운 이에게 슬픔도 두려움도 없다. 과거는 이미 갔고 미래는 아직 오지 않았다. 지금 이 순간을 살아라.`
};

const SYSTEM_PROMPT = `당신은 팔만대장경과 주요 불교 경전을 깊이 공부한 한국의 선지식입니다.

핵심 원칙:
1. 경전 구절을 근거로 말씀드립니다
2. 짧고 깊게, 2-4문장으로 핵심만 전합니다
3. 판단하지 않습니다
4. 답을 강요하지 않고 스스로 볼 수 있도록 이끕니다
5. 현대인이 이해하기 쉬운 말로 합니다
6. 정중하고 따뜻한 어투입니다

경전 지식:
${Object.values(SCRIPTURES).join('\n\n')}

팔만대장경 핵심 가르침:
- 사성제: 고(苦)-집(集)-멸(滅)-도(道). 괴로움이 있고, 원인이 있고, 소멸이 있고, 길이 있다.
- 팔정도: 바른 견해, 바른 생각, 바른 말, 바른 행동, 바른 생계, 바른 노력, 바른 마음챙김, 바른 집중.
- 삼법인: 제행무상(모든 것은 변한다), 제법무아(고정된 자아가 없다), 열반적정.
- 연기법: 이것이 있으므로 저것이 있고, 이것이 없으므로 저것이 없다.

응답 형식 (JSON으로만):
{"main":"핵심 말씀 2-4문장","scripture_name":"경전명","scripture_verse":"경전 구절"}`;

// ===== API 호출 =====
async function callClaude(messages, system) {
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, system })
  });
  const data = await res.json();
  return data.content[0].text;
}

// ===== 오늘의 법문 =====
async function loadDharma() {
  const system = `당신은 한국 불교 선지식입니다. 오늘 하루를 위한 짧은 법문을 전합니다.
JSON으로 응답: {"text":"법문 1-2문장","source":"경전명"}`;
  try {
    const raw = await callClaude([{role:'user',content:'오늘의 법문을 전해주세요.'}], system);
    const cleaned = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);

    const el = document.getElementById('home-daily');
    if (el) el.textContent = parsed.text;

    const dt = document.getElementById('dharma-text');
    const ds = document.getElementById('dharma-source');
    const dd = document.getElementById('dharma-date');
    if (dt) dt.textContent = parsed.text;
    if (ds) ds.textContent = '— ' + parsed.source;
    if (dd) dd.textContent = new Date().toLocaleDateString('ko-KR', {month:'long',day:'numeric'}) + ' 법문';
  } catch(e) {
    const fallback = '제행무상(諸行無常) — 모든 것은 변합니다. 지금의 괴로움도, 지금의 기쁨도. 다만 이 순간에 머무르세요.';
    ['home-daily','dharma-text'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = fallback;
    });
  }
}

// ===== 고민 상담 =====
async function askMonk() {
  const input = document.getElementById('worry-input').value.trim();
  if (!input) { showToast('고민을 입력해 주세요'); return; }

  const btn = document.getElementById('ask-btn');
  const card = document.getElementById('response-card');
  const rt = document.getElementById('response-text');

  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-flex;gap:5px;align-items:center"><span class="loading"><span></span><span></span><span></span></span></span>';
  card.classList.remove('visible');

  let system = SYSTEM_PROMPT;
  if (selectedScripture !== '전체' && SCRIPTURES[selectedScripture]) {
    system += `\n\n오늘은 특히 ${selectedScripture}의 가르침을 중심으로 말씀드려 주십시오.`;
  }

  try {
    const raw = await callClaude([{role:'user',content:input}], system);
    const cleaned = raw.replace(/```json|```/g,'').trim();
    let main='', sname='', sverb='';
    try {
      const p = JSON.parse(cleaned);
      main = p.main || raw;
      sname = p.scripture_name || '';
      sverb = p.scripture_verse || '';
    } catch { main = raw; }

    rt.textContent = main;

    const sq = document.getElementById('scripture-quote');
    const ss = document.getElementById('scripture-source');
    const st = document.getElementById('scripture-text');
    if (sname && sverb) {
      ss.textContent = sname;
      st.textContent = sverb;
      sq.style.display = 'block';
    } else {
      sq.style.display = 'none';
    }

    currentResponse = { worry: input, answer: main, source: sname, verse: sverb };
    card.classList.add('visible');
  } catch(e) {
    rt.textContent = '잠시 고요히 머무르세요. 곧 다시 여쭤봐 주십시오.';
    card.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = '☸ 말씀 여쭙기';
  }
}

// ===== 마음 올리기 =====
function shareToMaeum() {
  if (!currentResponse) return;

  const entry = {
    id: Date.now(),
    worry: currentResponse.worry.length > 60
      ? currentResponse.worry.slice(0,60) + '...'
      : currentResponse.worry,
    answer: currentResponse.answer,
    source: currentResponse.source,
    lights: 0,
    lit: false,
    time: '방금 전'
  };

  maeumData.unshift(entry);
  renderMaeum();
  showSection('maeum');
  showToast('마음이 올려졌습니다 🕯');
}

function renderMaeum() {
  const feed = document.getElementById('maeum-feed');
  if (!feed) return;

  if (maeumData.length === 0) {
    feed.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--ink-faint)">
      <p style="font-size:2rem;margin-bottom:1rem">🕯</p>
      <p style="font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.8">아직 올려진 마음이 없습니다.<br>첫 번째 마음을 올려주세요.</p>
    </div>`;
    return;
  }

  feed.innerHTML = maeumData.map((item, idx) => `
    <div class="maeum-card">
      <p class="maeum-worry">"${item.worry}"</p>
      <p class="maeum-answer">${item.answer.slice(0,120)}${item.answer.length > 120 ? '...' : ''}</p>
      <div class="maeum-footer">
        <span class="maeum-time">${item.time}</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${item.lights > 0 ? `<span class="light-count">🕯 ${item.lights}</span>` : ''}
          <button class="light-btn ${item.lit ? 'lit' : ''}" onclick="toggleLight(${idx})">
            <span class="flame">${item.lit ? '🔥' : '🕯'}</span>
            ${item.lit ? '등불이 닿았습니다' : '등불 놓기'}
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleLight(idx) {
  if (maeumData[idx].lit) return;
  maeumData[idx].lit = true;
  maeumData[idx].lights += 1;
  renderMaeum();
  showToast('당신의 마음이 닿았습니다 🔥');
}

// ===== 사찰 찾기 =====
const SAMPLE_TEMPLES = [
  { name: '조계사', address: '서울 종로구 우정국로 55', dist: '2.1km', sect: '조계종' },
  { name: '봉은사', address: '서울 강남구 봉은사로 531', dist: '4.3km', sect: '조계종' },
  { name: '길상사', address: '서울 성북구 선잠로5길 68', dist: '5.8km', sect: '조계종' },
  { name: '화계사', address: '서울 강북구 화계사길 117', dist: '7.2km', sect: '조계종' },
  { name: '진관사', address: '서울 은평구 진관길 73', dist: '9.4km', sect: '조계종' },
];

function findTemples() {
  const list = document.getElementById('temple-list');
  list.innerHTML = `<div class="loading" style="padding:2rem 0"><span></span><span></span><span></span></div>`;

  setTimeout(() => {
    list.innerHTML = SAMPLE_TEMPLES.map(t => `
      <div class="temple-card">
        <div class="temple-icon">🏯</div>
        <div class="temple-info">
          <p class="temple-name">${t.name}</p>
          <p class="temple-address">${t.address}</p>
          <p class="temple-dist">📍 ${t.dist} · ${t.sect}</p>
        </div>
      </div>
    `).join('');
  }, 1200);
}

// ===== 유틸 =====
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

  const section = document.getElementById(id);
  if (section) section.classList.add('active');

  const navBtn = document.getElementById('nav-' + id);
  if (navBtn) navBtn.classList.add('active');

  if (id === 'maeum') renderMaeum();
}

function selectScripture(el, val) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  selectedScripture = val;
}

function setExample(text) {
  document.getElementById('worry-input').value = text;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== 초기화 =====
window.addEventListener('DOMContentLoaded', () => {
  loadDharma();
  renderMaeum();
});
</script>
</body>
</html>
